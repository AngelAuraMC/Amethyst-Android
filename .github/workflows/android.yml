name: Android CI

on:
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      NOVACRAFT_RELEASE_KEYSTORE_BASE64: ${{ secrets.NOVACRAFT_RELEASE_KEYSTORE_BASE64 }}
      NOVACRAFT_RELEASE_STORE_PASSWORD: ${{ secrets.NOVACRAFT_RELEASE_STORE_PASSWORD }}
      NOVACRAFT_RELEASE_KEY_PASSWORD: ${{ secrets.NOVACRAFT_RELEASE_KEY_PASSWORD }}
      NOVACRAFT_RELEASE_KEY_ALIAS: ${{ secrets.NOVACRAFT_RELEASE_KEY_ALIAS }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download prebuilt JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare project
        run: |
          bash ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Run NovaCraft unit tests
        run: gradle :app_pojavlauncher:testDebugUnitTest

      - name: Build Debug APK only
        run: |
          gradle :app_pojavlauncher:assembleDebug
          cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate checksum
        run: md5sum out/app-debug.apk > out/app-debug.md5

      - name: Prepare protected release signing key
        if: ${{ env.NOVACRAFT_RELEASE_KEYSTORE_BASE64 != '' && env.NOVACRAFT_RELEASE_STORE_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_ALIAS != '' }}
        run: |
          printf '%s' "$NOVACRAFT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/novacraft-release.jks"
          test -s "$RUNNER_TEMP/novacraft-release.jks"
          echo "NOVACRAFT_RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/novacraft-release.jks" >> "$GITHUB_ENV"

      - name: Build signed NovaCraft Release APK
        if: ${{ env.NOVACRAFT_RELEASE_KEYSTORE_BASE64 != '' && env.NOVACRAFT_RELEASE_STORE_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_ALIAS != '' }}
        run: |
          gradle :app_pojavlauncher:assembleRelease
          mkdir -p out/release
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk out/release/NovaCraft-Android-Release.apk
          sha256sum out/release/NovaCraft-Android-Release.apk > out/release/NovaCraft-Android-Release.sha256

      - name: Upload signed Release APK
        if: ${{ env.NOVACRAFT_RELEASE_KEYSTORE_BASE64 != '' && env.NOVACRAFT_RELEASE_STORE_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_PASSWORD != '' && env.NOVACRAFT_RELEASE_KEY_ALIAS != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Android-Release
          path: out/release/*
          if-no-files-found: error

      - name: Explain release signing setup
        if: ${{ env.NOVACRAFT_RELEASE_KEYSTORE_BASE64 == '' || env.NOVACRAFT_RELEASE_STORE_PASSWORD == '' || env.NOVACRAFT_RELEASE_KEY_PASSWORD == '' || env.NOVACRAFT_RELEASE_KEY_ALIAS == '' }}
        run: echo "Signed release skipped. Configure the four NOVACRAFT_RELEASE_* GitHub Actions secrets to enable it."

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCraft-Android-Debug
          path: |
            out/app-debug.apk
            out/app-debug.md5
          if-no-files-found: error
