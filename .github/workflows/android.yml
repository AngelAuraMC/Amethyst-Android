
name: CraftLauncher Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Prepare files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir -p out

      - name: Build Debug APK
        run: |
          set +e
          gradle :app_pojavlauncher:assembleDebug --stacktrace --info 2>&1 | tee build-error.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> "$GITHUB_ENV"

          echo "## Build failure diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            echo "### Relevant error lines" >> "$GITHUB_STEP_SUMMARY"
            grep -nE 'What went wrong|Execution failed|error:|Caused by:|FAILURE:|failed' build-error.log | tail -n 100 >> "$GITHUB_STEP_SUMMARY" || true

            echo "### Last 80 log lines" >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build-error.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build succeeded." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$GRADLE_EXIT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CraftLauncher-build-log
          path: build-error.log
          if-no-files-found: warn

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CraftLauncher-debug
          path: app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
          
